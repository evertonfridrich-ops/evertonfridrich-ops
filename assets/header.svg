<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#180A0E;#0D1117" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#C41E3A">
        <animate attributeName="stop-color" values="#C41E3A;#E85D04;#C41E3A" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="50%" stop-color="#E85D04"/>
      <stop offset="100%" stop-color="#3FCF8E"/>
    </linearGradient>
  </defs>

  <!-- Background Plate -->
  <rect width="1200" height="220" rx="12" fill="url(#bg)" stroke="#30363D" stroke-width="1"/>

  <!-- Top Tech Bar -->
  <rect x="0" y="0" width="1200" height="34" rx="12" fill="#090D13" fill-opacity="0.9"/>
  <rect x="0" y="33" width="1200" height="1" fill="#30363D"/>

  <circle cx="24" cy="17" r="4" fill="#3FCF8E"/>
  <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#3FCF8E">SYSTEM STATUS: TIER-0 OPERATIONAL</text>
  <text x="500" y="21" font-family="monospace" font-size="11" fill="#8B949E">LATENCY: &lt;120ms P99</text>
  <text x="700" y="21" font-family="monospace" font-size="11" fill="#8B949E">INDEX: UBER H3 RES-9</text>
  <text x="920" y="21" font-family="monospace" font-size="11" fill="#8B949E">SECURITY: ZERO-TRUST RLS</text>
  <text x="1110" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#E85D04">EST. 2026</text>

  <!-- Titles -->
  <text x="40" y="75" font-family="monospace" font-size="12" font-weight="700" fill="#E85D04" letter-spacing="2">FOUNDER &amp; PRINCIPAL SYSTEMS ARCHITECT</text>
  <text x="40" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="1">Everton Fridrich</text>
  <text x="40" y="155" font-family="monospace" font-size="13" font-weight="600" fill="#C9D1D9" letter-spacing="1">ENTERPRISE FOOD-TECH ENGINE · DISTRIBUTED LOGISTICS · HIGH-THROUGHPUT REALTIME</text>

  <!-- Divider Line -->
  <rect x="40" y="175" width="1120" height="2" fill="url(#line-grad)"/>

  <!-- Sub Metrics -->
  <text x="40" y="198" font-family="monospace" font-size="11" fill="#8B949E">STACK: Next.js 16 (App Router) · React 19 · Supabase Postgres (RLS) · BullMQ · Redis · Uber H3 · Expo 57</text>
</svg>
