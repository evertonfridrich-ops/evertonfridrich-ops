<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240" role="img" aria-label="Séquito Systems Operational Telemetry">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131A"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="bar-gradient-ts" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bar-gradient-next" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
    <linearGradient id="bar-gradient-sql" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FCF8E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <style>
      .metric-label { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #8B949E; text-transform: uppercase; letter-spacing: 1.5px; }
      .metric-value { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .metric-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #38BDF8; font-weight: 600; }
      .chart-lang { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; font-weight: 600; fill: #C9D1D9; }
      .chart-pct { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; font-weight: 700; fill: #8B949E; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="240" rx="12" fill="#090D13" stroke="#21262D" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <rect x="0" y="0" width="1200" height="34" rx="12" fill="#0D1117"/>
  <rect x="0" y="33" width="1200" height="1" fill="#30363D"/>
  <text x="24" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#E85D04">● TELEMETRY ENGINE // TIER-0 METRICS</text>
  <text x="1000" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B949E">UPTIME 99.99% · 2026</text>

  <!-- Metric Column 1 -->
  <g transform="translate(24, 54)">
    <rect width="260" height="160" rx="8" fill="url(#card-bg)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" class="metric-label">Throughput / Scale</text>
    <text x="16" y="60" class="metric-value">300+ Commits</text>
    <text x="16" y="82" class="metric-sub">Multi-tenant Architecture</text>
    <line x1="16" y1="98" x2="244" y2="98" stroke="#21262D" stroke-width="1"/>
    <text x="16" y="120" class="metric-label">Execution Target</text>
    <text x="16" y="142" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#3FCF8E">Staff+ Production Ready</text>
  </g>

  <!-- Metric Column 2 -->
  <g transform="translate(304, 54)">
    <rect width="260" height="160" rx="8" fill="url(#card-bg)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" class="metric-label">Driver Spatial Index</text>
    <text x="16" y="60" class="metric-value">Uber H3 Res-9</text>
    <text x="16" y="82" class="metric-sub">Sub-second Routing Mesh</text>
    <line x1="16" y1="98" x2="244" y2="98" stroke="#21262D" stroke-width="1"/>
    <text x="16" y="120" class="metric-label">Dispatched Latency</text>
    <text x="16" y="142" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38BDF8">&lt; 180ms P99 Sync</text>
  </g>

  <!-- Metric Column 3: Stack Breakdown -->
  <g transform="translate(584, 54)">
    <rect width="592" height="160" rx="8" fill="url(#card-bg)" stroke="#30363D" stroke-width="1"/>
    <text x="20" y="28" class="metric-label">Core Engineering Stack Composition</text>
    
    <!-- TypeScript -->
    <text x="20" y="58" class="chart-lang">TypeScript / Strict Type System</text>
    <text x="520" y="58" class="chart-pct">54.8%</text>
    <rect x="20" y="66" width="552" height="8" rx="4" fill="#21262D"/>
    <rect x="20" y="66" width="302" height="8" rx="4" fill="url(#bar-gradient-ts)"/>

    <!-- Next.js & React -->
    <text x="20" y="98" class="chart-lang">Next.js 16 (App Router) · React 19</text>
    <text x="520" y="98" class="chart-pct">28.4%</text>
    <rect x="20" y="106" width="552" height="8" rx="4" fill="#21262D"/>
    <rect x="20" y="106" width="156" height="8" rx="4" fill="url(#bar-gradient-next)"/>

    <!-- PostgreSQL / RLS -->
    <text x="20" y="138" class="chart-lang">PostgreSQL RLS · BullMQ &amp; Redis</text>
    <text x="520" y="138" class="chart-pct">16.8%</text>
    <rect x="20" y="146" width="552" height="8" rx="4" fill="#21262D"/>
    <rect x="20" y="146" width="94" height="8" rx="4" fill="url(#bar-gradient-sql)"/>
  </g>
</svg>
